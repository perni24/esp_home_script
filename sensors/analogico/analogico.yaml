substitutions:
  id: "" 
  name: ""
  pin: ""
  attenuation: ""
  samples: ""
  accuracy_decimals: ""
  update_interval: ""
  unit_of_measurement: ""
  psi_massimi: ""
  volt_massimi: ""

sensor:
  - platform: adc
    id: ${id}
    name: ${name}
    pin: ${pin}
    attenuation: ${attenuation}  # potrebbe andare in errore nel caso spostare dentro tag pin e aggiungere number sempre dentro pin
    samples: ${samples}
    accuracy_decimals: ${accuracy_decimals}
    update_interval: ${update_interval}
    unit_of_measurement: ${unit_of_measurement}
    filters:
      - lambda: return x * (${psi_massimi} / ${volt_massimi});